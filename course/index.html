<script type="text/plain" id="py-worker">
let pyodide = null;
let currentId = 0;
let currentOut = "";

function post(msg){
  self.postMessage(msg);
}

async function boot(){
  importScripts("https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js");
  const indexURL = "https://cdn.jsdelivr.net/pyodide/v0.29.0/full/";
  pyodide = await loadPyodide({ indexURL: indexURL });
  pyodide.setStdout({ batched: function(text){
    if (!text) return;
    const chunk = text.endsWith("\n") ? text : text + "\n";
    currentOut += chunk;
    post({ type: "out", id: currentId, text: chunk });
  }});
  pyodide.setStderr({ batched: function(text){
    if (!text) return;
    post({ type: "out", id: currentId, text: text.endsWith("\n") ? text : text + "\n" });
  }});
  post({ type: "ready", version: pyodide.version || "Pyodide" });
}

const ready = boot().catch(function(err){
  post({ type: "boot-error", message: String(err && err.message ? err.message : err) });
});

self.onmessage = async function(event){
  const data = event.data;
  if (!data || data.type !== "run") return;
  try {
    await ready;
  } catch (err) {
    post({ type: "error", id: data.id, message: "Python failed to load." });
    return;
  }
  if (!pyodide) {
    post({ type: "error", id: data.id, message: "Python is not ready." });
    return;
  }
  currentId = data.id;
  currentOut = "";
  let ns = null;
  try {
    ns = pyodide.runPython("{}");
    await pyodide.runPythonAsync(data.code, { globals: ns });
    if (data.tests) {
      ns.set("__stdout__", currentOut);
      await pyodide.runPythonAsync(data.tests, { globals: ns });
    }
    post({ type: "done", id: data.id, hasTests: !!data.tests });
  } catch (err) {
    post({ type: "error", id: data.id, message: String(err && err.message ? err.message : err) });
  } finally {
    if (ns) {
      try { ns.destroy(); } catch (_) {}
    }
  }
};
</script>

def route(zone, fragile):

    if zone == "Mountain Temple" or zone == "Red Cliff House":
        return "priority"
    if fragile:
        return "crate"
    return "standard"

    def __init__(self, name):
        self.name = name
        self.carrying = None
        self.delivered = []

            raise ValueError("hands full")
        self.carrying = package
        return True

        if self.carrying is None:
            return False
        self.delivered.append(self.carrying)
        self.carrying = None
        return True

        report = {}
        for quest in self.quests:
            report[quest.name] = len(quest.steps)
        return report

const STORE_PROGRESS = "messenger-python-progress-v1";
const STORE_DRAFT = "messenger-python-draft-v1:";
const STORE_LAST = "messenger-python-last-v1";

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function readStore(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : value;
  } catch (_) {
    return fallback;
  }
}
function writeStore(key, value) {
  try { localStorage.setItem(key, value); } catch (_) {}
}
function readProgress() {
  try { return new Set(JSON.parse(readStore(STORE_PROGRESS, "[]"))); }
  catch (_) { return new Set(); }
}
function saveProgress() {
  writeStore(STORE_PROGRESS, JSON.stringify(Array.from(completed)));
}
function getDraft(ch) {
  return readStore(STORE_DRAFT + ch.id, null);
}
function saveDraft(ch, code) {
  writeStore(STORE_DRAFT + ch.id, code);
}
function starterOf(ch) {
  const el = document.getElementById("starter-" + ch.num);
  return el ? el.textContent.replace(/^\n/, "").replace(/\s+$/, "") : "";
}
function testsOf(ch) {
  const el = document.getElementById("tests-" + ch.num);
  return el ? el.textContent.trim() : "";
}
function solutionOf(ch) {
  const el = document.getElementById("solution-" + ch.num);
  return el ? el.textContent.replace(/^\n/, "").replace(/\s+$/, "") : "";
}
function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

let completed = readProgress();
let currentIndex = 0;
let worker = null;
let activeRun = null;
let pyReady = false;
let runSeq = 0;

const host = $("#chapter-host");
const rail = $("#rail-list");
const statusEl = $("#py-status");
const statusText = $("#py-status-text");

function setStatus(text, kind) {
  statusText.textContent = text;
  statusEl.dataset.kind = kind || "idle";
}

function updateProgress() {
  const total = CHAPTERS.length;
  const done = completed.size;
  $("#progress-text").textContent = done + " / " + total + " shifts";
  $("#progress-bar").style.width = (100 * done / total) + "%";
  CHAPTERS.forEach((ch) => {
    const btn = $('#rail-list button[data-ch="' + ch.id + '"]');
    if (!btn) return;
    const ok = btn.querySelector(".ok");
    if (ok) ok.textContent = completed.has(ch.id) ? "complete" : "";
  });
}

function renderRail() {
  rail.innerHTML = CHAPTERS.map((ch, i) => {
    const done = completed.has(ch.id) ? "complete" : "";
    return '<li><button type="button" data-ch="' + ch.id + '" data-i="' + i + '">' +
      '<span class="n">' + ch.num + '</span>' +
      '<span class="t">' + ch.title + '</span>' +
      '<span class="ok">' + done + '</span>' +
      '</button></li>';
  }).join("");
  $$("#rail-list button").forEach((btn) => {
    btn.addEventListener("click", () => goTo(Number(btn.dataset.i), true));
  });
  markRailCurrent();
}

function markRailCurrent() {
  $$("#rail-list button").forEach((btn) => {
    if (Number(btn.dataset.i) === currentIndex) btn.setAttribute("aria-current", "step");
    else btn.removeAttribute("aria-current");
  });
}

function goTo(index, updateHash) {
  if (activeRun) return;
  if (index < 0 || index >= CHAPTERS.length) return;
  currentIndex = index;
  const ch = CHAPTERS[index];
  writeStore(STORE_LAST, ch.id);
  if (updateHash) {
    try { history.replaceState(null, "", "#" + ch.id); } catch (_) {}
  }
  renderChapter(ch);
  markRailCurrent();
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function renderChapter(ch) {
  const isDone = completed.has(ch.id);
  const startMsg = pyReady ? "Python is ready. Press Run." : "Python is asleep. Press Run to wake it.";
  const hero = ch.hero ? `
    <section class="hero" aria-label="Title screen">
      <div class="hero-copy">
        <h2>MESSENGER</h2>
        <p>A small planet. Five deliveries. One Python terminal.</p>
        <p class="small">Learn Python from the first <code>print</code> to
        object-oriented programming (OOP, or POO in Portuguese). Every shift
        uses a real detail from the Messenger game by abeto.co.</p>
        <p class="small">Challenges run in your browser with Pyodide.</p>
      </div>
      <figure class="hero-shot">
        <img src="assets/messenger-title.png" width="780" height="493" alt="Title screen of Messenger: a small planet with a yellow Play button.">
        <figcaption>Title screen, captured 2026-10-22. Messenger by abeto.co.</figcaption>
      </figure>
    </section>` : "";

  const prev = currentIndex > 0 ? CHAPTERS[currentIndex - 1] : null;
  const next = currentIndex < CHAPTERS.length - 1 ? CHAPTERS[currentIndex + 1] : null;

  host.innerHTML = `
    ${hero}
    <header class="chapter-head">
      <span class="kicker">Shift ${ch.num}${isDone ? " · complete" : ""}</span>
      <div class="chapter-title">
        <span class="chapter-num" aria-hidden="true">${ch.num}</span>
        <div>
          <h1>${ch.title}</h1>
          <p class="chapter-tag">${ch.tag}</p>
        </div>
      </div>
    </header>

    <section class="panel scene" aria-label="Story">
      <h2>Dispatch</h2>
      ${ch.scene}
    </section>

    <section class="panel field" aria-label="Field note">
      <span class="label">Field note from the bundle</span>
      ${ch.note}
    </section>

    <section class="panel concept" aria-label="Python idea">
      <span class="label">Python idea</span>
      <ul>${ch.concept.map((item) => "<li>" + item + "</li>").join("")}</ul>
    </section>

    <section class="panel task" aria-label="Your task">
      <span class="label">Your task</span>
      ${ch.task}
      <div class="editor-wrap">
        <div class="editor-bar">
          <span class="file">shift_${ch.num}.py</span>
          <span class="spacer"></span>
          <button class="mini" type="button" id="reset-code">Reset</button>
        </div>
        <label class="sr-only" for="code">Python code for shift ${ch.num}</label>
        <textarea class="editor" id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="button" id="run-code">Run</button>
        <button class="btn btn-check" type="button" id="check-code">Check</button>
        <span class="run-note" id="run-note">Ctrl + Enter runs the code.</span>
      </div>
      <pre class="output" id="output" aria-live="polite" tabindex="0">${startMsg}</pre>
      <details>
        <summary>Hint</summary>
        <p>${ch.hint}</p>
      </details>
      <details>
        <summary>Show a working solution</summary>
        <pre class="solution-pre"><code>${escapeHtml(solutionOf(ch))}</code></pre>
      </details>
    </section>

    <nav class="chapter-nav" aria-label="Chapter navigation">
      ${prev ? '<button class="btn" type="button" id="prev-ch">← ' + prev.title + '</button>' : '<span></span>'}
      ${next ? '<button class="btn btn-primary" type="button" id="next-ch">' + next.title + ' →</button>' : '<span></span>'}
    </nav>

    <footer class="footer">
      <p><strong>Sources.</strong> The technical details come from the public
      page bundle at <a href="https://messenger.abeto.co/" rel="noopener">messenger.abeto.co</a>,
      captured on 2026-10-22. Read the <a href="reverse-engineering.md">reverse-engineering dossier</a>
      for the evidence and the limits.</p>
      <p>Messenger belongs to <a href="https://abeto.co" rel="noopener">abeto.co</a>.
      This is an independent study companion. Challenges run in a web worker with
      <a href="https://pyodide.org/" rel="noopener">Pyodide</a>; the first run needs a network
      connection to the CDN.</p>
    </footer>
  `;

  const ta = $("#code");
  ta.value = getDraft(ch) === null ? starterOf(ch) : getDraft(ch);
  ta.addEventListener("input", () => {
    saveDraft(ch, ta.value);
    $("#run-note").textContent = "Draft saved in this browser.";
  });
  ta.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      ta.blur();
      return;
    }
    if (event.key === "Tab" && !event.shiftKey) {
      event.preventDefault();
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      ta.value = ta.value.slice(0, start) + "    " + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 4;
      saveDraft(ch, ta.value);
    }
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      event.preventDefault();
      runCurrent(false);
    }
  });

  $("#reset-code").addEventListener("click", () => {
    ta.value = starterOf(ch);
    saveDraft(ch, ta.value);
    $("#run-note").textContent = "Starter code restored.";
    $("#output").textContent = "Ready.";
    $("#output").classList.remove("err");
  });
  $("#run-code").addEventListener("click", () => runCurrent(false));
  $("#check-code").addEventListener("click", () => runCurrent(true));
  if (prev) $("#prev-ch").addEventListener("click", () => goTo(currentIndex - 1, true));
  if (next) $("#next-ch").addEventListener("click", () => goTo(currentIndex + 1, true));
  if (isDone) $("#run-note").textContent = "You passed this shift. You can run it again.";
  updateProgress();
}

function appendOutput(text) {
  const out = $("#output");
  if (!out) return;
  if (out.dataset.fresh !== "no") {
    out.textContent = "";
    out.dataset.fresh = "no";
    out.classList.remove("err");
  }
  out.textContent += text;
  out.scrollTop = out.scrollHeight;
}

function showOutput(text, isError) {
  const out = $("#output");
  if (!out) return;
  out.textContent = text;
  out.dataset.fresh = "no";
  out.classList.toggle("err", !!isError);
  out.scrollTop = out.scrollHeight;
}

function setBusy(busy) {
  const run = $("#run-code");
  const check = $("#check-code");
  if (run) run.disabled = busy;
  if (check) check.disabled = busy;
  $$("#rail-list button, #prev-ch, #next-ch").forEach((button) => { button.disabled = busy; });
  if (busy) setStatus("Python working", "busy");
  else setStatus("Python ready", "ready");
}

function wakeWorker() {
  if (worker) return worker;
  const source = $("#py-worker").textContent;
  const blob = new Blob([source], { type: "text/javascript" });
  const url = URL.createObjectURL(blob);
  worker = new Worker(url);
  pyReady = false;
  setStatus("Python waking up", "busy");
  worker.onmessage = onWorkerMessage;
  worker.onerror = (event) => {
    if (activeRun) clearTimeout(activeRun.timer);
    pyReady = false;
    const dead = worker;
    worker = null;
    if (dead) dead.terminate();
    activeRun = null;
    setBusy(false);
    setStatus("Python failed", "bad");
    const note = $("#run-note");
    if (note) note.textContent = "Python did not start. Press Run to try again.";
    showOutput("Could not load Pyodide. Check the network connection to cdn.jsdelivr.net and reload the page.", true);
  };
  return worker;
}

function onWorkerMessage(event) {
  if (!worker) return;
  const msg = event.data || {};
  if (msg.type === "ready") {
    pyReady = true;
    if (activeRun) watchExecution(activeRun.id);
    if (!activeRun) setStatus("Python ready", "ready");
    const note = $("#run-note");
    if (note && !activeRun) note.textContent = "Python " + (msg.version || "") + " is ready.";
    return;
  }
  if (msg.type === "boot-error") {
    if (activeRun) clearTimeout(activeRun.timer);
    pyReady = false;
    const dead = worker;
    worker = null;
    if (dead) dead.terminate();
    activeRun = null;
    setBusy(false);
    setStatus("Python failed", "bad");
    const note = $("#run-note");
    if (note) note.textContent = "Python did not start. Press Run to try again.";
    showOutput("Pyodide could not start: " + msg.message, true);
    return;
  }
  if (!activeRun || msg.id !== activeRun.id) return;
  if (msg.type === "out") {
    appendOutput(msg.text);
    return;
  }
  if (msg.type === "done") {
    clearTimeout(activeRun.timer);
    const wasCheck = activeRun.check;
    const ch = CHAPTERS[currentIndex];
    activeRun = null;
    setBusy(false);
    if (wasCheck) {
      completed.add(ch.id);
      saveProgress();
      updateProgress();
      appendOutput("Passed. Shift " + ch.num + " is complete.\n");
      $("#run-note").textContent = "Shift complete.";
    } else {
      appendOutput("Ran. No tests were checked.\n");
      $("#run-note").textContent = "Ran. Press Check to test the shift.";
    }
    return;
  }
  if (msg.type === "error") {
    clearTimeout(activeRun.timer);
    const wasCheck = activeRun.check;
    activeRun = null;
    setBusy(false);
    appendOutput(msg.message);
    const out = $("#output");
    if (out) out.classList.add("err");
    $("#run-note").textContent = wasCheck
      ? "Not yet. Read the last line of the error."
      : "The code stopped with an error.";
  }
}

function stopActiveRun(message, noteText) {
  if (!activeRun) return;
  clearTimeout(activeRun.timer);
  activeRun = null;
  if (worker) {
    worker.terminate();
    worker = null;
  }
  pyReady = false;
  setBusy(false);
  setStatus("Python restarting", "bad");
  const note = $("#run-note");
  if (note) note.textContent = noteText;
  showOutput(message, true);
}

function watchExecution(id) {
  if (!activeRun || activeRun.id !== id) return;
  clearTimeout(activeRun.timer);
  activeRun.timer = setTimeout(() => {
    if (!activeRun || activeRun.id !== id) return;
    stopActiveRun(
      "Stopped after 15 seconds. Check for an endless loop. Press Run to restart Python.",
      "Stopped after 15 seconds."
    );
  }, 15000);
}

function watchBoot(id) {
  if (!activeRun || activeRun.id !== id) return;
  clearTimeout(activeRun.timer);
  activeRun.timer = setTimeout(() => {
    if (!activeRun || activeRun.id !== id) return;
    stopActiveRun(
      "Python did not finish loading. Check the network and press Run to try again.",
      "Python did not finish loading."
    );
  }, 90000);
}

function runCurrent(check) {
  if (activeRun) return;
  const ch = CHAPTERS[currentIndex];
  const ta = $("#code");
  if (!ta) return;
  const code = ta.value;
  const tests = check ? testsOf(ch) : "";
  const w = wakeWorker();
  if (!w) return;
  const out = $("#output");
  out.textContent = "";
  out.dataset.fresh = "no";
  out.classList.remove("err");
  runSeq += 1;
  const id = runSeq;
  activeRun = { id: id, check: !!check, timer: null };
  if (pyReady) watchExecution(id);
  else watchBoot(id);
  setBusy(true);
  w.postMessage({ type: "run", id: id, code: code, tests: tests });
}

function initialIndex() {
  const hash = (location.hash || "").replace(/^#/, "");
  if (hash) {
    const found = CHAPTERS.findIndex((ch) => ch.id === hash);
    if (found >= 0) return found;
  }
  const last = readStore(STORE_LAST, "");
  const found = CHAPTERS.findIndex((ch) => ch.id === last);
  return found >= 0 ? found : 0;
}

const skipLink = $(".skip-link");
if (skipLink) {
  skipLink.addEventListener("click", (event) => {
    event.preventDefault();
    const main = $("#main");
    if (!main) return;
    main.focus();
    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    main.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
  });
}

renderRail();
updateProgress();
goTo(initialIndex(), false);
</script>
